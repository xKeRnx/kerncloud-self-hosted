name: kerncloud-infrastructure-aws
services:
  infrastructure:
    image: ${KERNCLOUD_IMAGE:-kerncloud-local:0.2}
    command: ["npm", "run", "infrastructure"]
    env_file: .env.infrastructure
    environment:
      INFRA_MODE: aws_ecs
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    restart: unless-stopped
