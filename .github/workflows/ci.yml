name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:local
      - run: npm run build -- --webpack
        env:
          NODE_OPTIONS: --max-old-space-size=3072
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm ci --ignore-scripts --prefix desktop-app
      - run: npm test --prefix desktop-app
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kerncloud
          POSTGRES_PASSWORD: integration-fixture-only
          POSTGRES_DB: kerncloud_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kerncloud -d kerncloud_ci_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y default-jre-headless poppler-utils
      - run: npm ci
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://kerncloud:integration-fixture-only@localhost:5432/kerncloud_ci_test
          DEPLOYMENT_MODE: self-hosted
          ALLOW_REGISTRATION: 'true'
          PUBLIC_URL: http://localhost:3100
          PUBLIC_ENVIRONMENT_URL: http://localhost:3200
