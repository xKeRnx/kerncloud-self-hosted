name: kerncloud-infrastructure
services:
  infrastructure:
    image: ${KERNCLOUD_IMAGE:-kerncloud-local:0.2}
    user: "0:0"
    command: ["npm", "run", "infrastructure"]
    env_file: .env.infrastructure
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    restart: unless-stopped
